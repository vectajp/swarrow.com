<!doctype html>
<html lang="ja">
  <head>
    <script data-ga-measurement-id="%sveltekit.env.PUBLIC_GA_MEASUREMENT_ID%">
      const measurementId =
        document.currentScript?.getAttribute("data-ga-measurement-id") ?? "";
      const gtag = (...args) => {
        window.dataLayer.push(args);
      };

      if (/^G-[A-Z0-9]+$/.test(measurementId)) {
        window.dataLayer = window.dataLayer || [];
        gtag("js", new Date());
        gtag("config", measurementId);

        const googleTag = document.createElement("script");
        googleTag.async = true;
        googleTag.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementId)}`;
        document.head.append(googleTag);
      }
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    >
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
